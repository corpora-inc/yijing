version: 2
updates:
  - package-ecosystem: npm
    directory: /corpora-i-ching
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /corpora-i-ching/src-tauri
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
